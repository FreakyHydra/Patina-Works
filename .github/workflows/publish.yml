name: Publish Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Patina Works
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release JAR
        run: ./gradlew build --no-daemon --stacktrace

      - name: Publish to GitHub, Modrinth, and CurseForge
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3
        with:
          files: build/libs/!(*-@(dev|sources|javadoc)).jar

          name: Patina Works ${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}
          version-type: alpha

          loaders: neoforge
          game-versions: "1.21.1"
          java: "21"
          environment: "client | server"

          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
